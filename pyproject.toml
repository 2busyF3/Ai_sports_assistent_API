[project]
name = "ai-fitness-assistant"
version = "0.1.0"
description = "LangGraph-powered training decision support MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
cloud = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "psycopg[binary]>=3.2.0",
]

[project.scripts]
fitness-assistant = "main:main"
fitness-assistant-ui = "app:main"

[tool.setuptools]
py-modules = ["main", "models"]

[tool.setuptools.packages.find]
include = ["analytics*", "database*", "graph*", "llm*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
